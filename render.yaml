# render.yaml — "Bản thiết kế" (Blueprint) để deploy Lì Xì Bot lên Render.com.
#
# Cách dùng: trên Render bấm New → Blueprint, chọn repo này, Render tự đọc file này
# và tạo sẵn dịch vụ theo đúng cấu hình bên dưới. Hướng dẫn bấm từng bước cho người
# không rành kỹ thuật nằm ở bot/README.md, mục "Chạy 24/7 miễn phí trên Render".
#
# Lưu ý quan trọng về gói MIỄN PHÍ của Render:
#   - Chỉ có "web service" (dịch vụ web), KHÔNG có "background worker".
#     → Vì vậy bot chạy ở chế độ webhook: Telegram gửi request HTTP vào dịch vụ này.
#   - Dịch vụ tự "ngủ" sau ~15 phút không có request nào → tin nhắn đầu tiên sau khi
#     ngủ có thể chậm khoảng 1 phút (xem README).
#   - KHÔNG có đĩa lưu trữ bền vững → dữ liệu trong bot/data/ bị xoá mỗi lần khởi
#     động lại. Đây là hạn chế đã biết, xem cảnh báo trong README.

services:
  # Một dịch vụ duy nhất: web service chạy bot ở chế độ webhook.
  - type: web
    # Tên dịch vụ, cũng là phần đầu của địa chỉ công khai:
    # https://lixi-bot-telegram.onrender.com (Render có thể thêm hậu tố nếu tên đã có người dùng).
    name: lixi-bot-telegram
    # Môi trường chạy: Node.js (bot viết bằng JavaScript thuần, không cần build C++).
    runtime: node
    # Gói miễn phí — không cần thẻ ngân hàng.
    plan: free
    # Thư mục gốc của ứng dụng trong repo: mã nguồn bot nằm trong thư mục bot/,
    # nên mọi lệnh build/start bên dưới đều chạy bên trong bot/.
    rootDir: bot
    # Cài dependency đúng theo package-lock.json (chắc chắn, lặp lại được).
    buildCommand: npm ci
    # Lệnh khởi động, tương đương "node index.js" (xem bot/package.json).
    startCommand: npm start
    # Render gọi đường dẫn này để kiểm tra dịch vụ còn sống không.
    # Bot trả về 200 kèm {"ok":true,"mode":"webhook"} — không lộ dữ liệu người dùng.
    healthCheckPath: /healthz
    # (Không đặt "region" — dùng khu vực mặc định của Render để bớt thao tác chọn lựa.)
    envVars:
      # Token bot lấy từ @BotFather.
      # sync: false nghĩa là GIÁ TRỊ KHÔNG nằm trong repo — Render sẽ HỎI bạn dán token
      # lúc tạo Blueprint, rồi lưu kín ở phía Render. TUYỆT ĐỐI không ghi token vào file này.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Phiên bản Node dùng để chạy bot (bot yêu cầu Node 22 trở lên).
      - key: NODE_VERSION
        value: "22"
      # Ghi chú: KHÔNG cần khai báo PORT và RENDER_EXTERNAL_URL — Render tự tiêm hai biến
      # này vào dịch vụ. Bot tự nhận ra RENDER_EXTERNAL_URL và bật chế độ webhook.
