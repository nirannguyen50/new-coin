name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    name: Smart contracts (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test

  tokenomics:
    name: Tokenomics schedule tool
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokenomics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tokenomics/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Regenerate example schedule and enforce red-flag rules
        run: python unlock_schedule.py config.example.json --months 36 --out out/ --strict

  bot:
    name: Lì Xì Bot (Telegram, off-chain)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm test

  website:
    name: Landing page checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check website/script.js
      - name: Ensure no external resources are loaded
        run: |
          if grep -nE 'https?://|//cdn|@import' website/index.html website/style.css website/script.js; then
            echo "External resource reference found" && exit 1
          fi
