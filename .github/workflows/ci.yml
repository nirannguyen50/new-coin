name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    name: Smart contracts (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test

  tokenomics:
    name: Tokenomics schedule tool
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokenomics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tokenomics/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Regenerate example schedule and enforce red-flag rules
        run: python unlock_schedule.py config.example.json --months 36 --out out/ --strict

  bot:
    name: Lì Xì Bot (Telegram, off-chain)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot

    # Postgres thật cho nhóm test tích hợp của src/postgres-store.js.
    # Không có service này thì nhóm test đó tự BỎ QUA (skip) — nhưng ở CI ta muốn nó
    # CHẠY THẬT, vì đó là nơi kiểm chứng khoá hàng (row lock), ràng buộc CHECK số dư
    # không âm, và việc nhiều lệnh chạy song song không tiêu quá số dư.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lixi_test
        ports:
          - 5432:5432
        # Chờ tới khi Postgres thật sự sẵn sàng nhận kết nối rồi mới chạy các bước sau.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - name: Chạy test (kèm test tích hợp Postgres)
        env:
          # localhost:5432 được ánh xạ tới service container ở trên.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lixi_test
        run: npm test
      - name: Kiểm tra cú pháp các hàm serverless (api/)
        working-directory: .
        run: |
          for f in api/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json hop le')"

  website:
    name: Landing page checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check website/script.js
      - name: Ensure no external resources are loaded
        run: |
          if grep -nE 'https?://|//cdn|@import' website/index.html website/style.css website/script.js; then
            echo "External resource reference found" && exit 1
          fi
